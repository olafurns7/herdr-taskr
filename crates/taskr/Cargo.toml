[package]
name = "taskr"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
contract = ["taskr-core/contract"]

[dependencies]
taskr-core = { path = "../taskr-core" }
anyhow = "1"
serde_json = "1"
unicode-width = "0.2"
unicode-segmentation = "1.13"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
rustix = { version = "1", features = ["fs", "process", "net", "termios"] }
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "signal", "io-util"] }
axum = "0.8"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-auto"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
